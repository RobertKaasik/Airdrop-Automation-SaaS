<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Anti-Sybil Panel</title>
    <!-- Официальный скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        /* Скопированный премиум-стиль AFX */
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Шапка (Header) */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            border-bottom: 1px solid #1f1f1f;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        /* Общие стили кнопок */
        button {
            cursor: pointer;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .btn-green-sm {
            background-color: #00d95f;
            color: #000;
            padding: 10px 20px;
            font-size: 14px;
        }
        .btn-green-sm:hover { background-color: #00bf53; }

        .btn-dark-sm {
            background-color: transparent;
            color: #fff;
            border: 1px solid #333;
            padding: 10px 20px;
            font-size: 14px;
        }
        .btn-dark-sm:hover { background-color: #1a1a1a; }

        /* Главный экран (Hero) - Выравнивание по левому краю */
        .hero {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: flex-start; /* Смещаем весь контент влево */
            justify-content: flex-start;
            padding: 80px 10% 0 10%; /* Добавляем отступы по краям */
            text-align: left; /* Выравниваем сам текст */
            background: radial-gradient(circle at 20% 40%, rgba(0, 217, 95, 0.08) 0%, rgba(10, 10, 10, 1) 60%);
        }

        .hero h1 {
            font-size: 46px;
            font-weight: 700;
            margin-bottom: 20px;
            line-height: 1.2;
            max-width: 800px;
        }

        .hero p {
            color: #8892b0;
            font-size: 18px;
            margin-bottom: 40px;
            max-width: 600px;
            line-height: 1.5;
        }

        .hero-buttons {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .btn-green-lg {
            background-color: #00d95f;
            color: #000;
            padding: 14px 32px;
            font-size: 16px;
            border-radius: 8px;
        }
        .btn-green-lg:hover { background-color: #00bf53; }

        .btn-dark-lg {
            background-color: #0f0f0f;
            color: #fff;
            border: 1px solid #333;
            padding: 14px 32px;
            font-size: 16px;
            border-radius: 8px;
        }
        .btn-dark-lg:hover { background-color: #1a1a1a; }

        /* Контейнер статуса - сдвинут влево */
        #wallet-status {
            color: #8892b0;
            font-size: 14px;
            margin-bottom: 20px;
            text-align: left;
        }

        #anti-sybil-container {
            width: 100%;
            max-width: 600px;
            margin: 0; /* Убрано авто-центрирование */
            text-align: left;
        }
        
        .card {
            padding: 20px;
            border-radius: 12px;
            margin-top: 20px;
        }
        
        .faucet-link {
            display: inline-block;
            margin-top: 10px;
            color: #3498db;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- Шапка интерфейса -->
    <div class="header">
        <div class="logo-container">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="background: transparent; width: 32px; height: 32px; flex-shrink: 0;">
                <!-- Лежащая монета (изометрия) -->
                <ellipse cx="12" cy="20" rx="10" ry="3" stroke="#00d95f" stroke-width="2" fill="#00d95f" fill-opacity="0.1"/>
                <path d="M2 20c0 1.66 4.48 3 10 3s10-1.34 10-3" stroke="#00d95f" stroke-width="2"/>
                <!-- Внутреннее свечение монеты -->
                <ellipse cx="12" cy="20" rx="5" ry="1.5" stroke="#00d95f" stroke-width="1" stroke-opacity="0.5"/>
                
                <!-- Падающий аирдроп (изометрический куб) -->
                <path d="M12 3L7 5.5L12 8L17 5.5L12 3Z" fill="#ffffff"/>
                <path d="M7 5.5V10.5L12 13V8L7 5.5Z" fill="#cccccc"/>
                <path d="M17 5.5V10.5L12 13V8L17 5.5Z" fill="#999999"/>
                
                <!-- Линии скорости (эффект падения) -->
                <path d="M12 14V17" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
                <path d="M8 11.5V14" stroke="#00d95f" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
                <path d="M16 11.5V14" stroke="#00d95f" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7"/>
            </svg>
            <span>AIRDROP-X</span>
        </div>
        <div class="header-actions">
            <!-- Кнопка подключения кошелька -->
            <button id="connect-btn" class="btn-green-sm" onclick="connectWallet()">Подключить кошелек</button>
            <button class="btn-dark-sm">Войти</button>
            <button class="btn-dark-sm">RU 🇷🇺</button>
        </div>
    </div>

    <!-- Главный контент -->
    <div class="hero">
        <h1>Мощный инструмент<br>для фарма и буста Airdrop</h1>
        <p>Фармите поинты, прогревайте кошельки и набивайте транзакции — с надёжной защитой от Anti-Sybil алгоритмов и минимальным риском бритья.</p>
        
        <div class="hero-buttons">
            <!-- Кнопка запуска -->
            <button id="farm-btn" class="btn-green-lg" onclick="startFarm()">Получить доступ (Запуск)</button>
            <button class="btn-dark-lg">Настройки</button>
        </div>

        <div id="wallet-status">Кошелек не подключен</div>
        <div id="anti-sybil-container"></div>
    </div>

    <script>
        // 1. Проверка на открытие с ПК в Telegram Desktop
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
        const isInTelegramDesktop = window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.platform === 'tdesktop';

        if (!isMobile && isInTelegramDesktop) {
            const webVersionUrl = "http://127.0.0.1:5500/index.html"; 
            
            const warningDiv = document.createElement('div');
            warningDiv.style.position = 'fixed';
            warningDiv.style.top = '0';
            warningDiv.style.left = '0';
            warningDiv.style.width = '100%';
            warningDiv.style.height = '100%';
            warningDiv.style.backgroundColor = 'rgba(10, 10, 10, 0.98)';
            warningDiv.style.zIndex = '9999';
            warningDiv.style.display = 'flex';
            warningDiv.style.flexDirection = 'column';
            warningDiv.style.alignItems = 'center';
            warningDiv.style.justifyContent = 'center';
            warningDiv.style.color = '#fff';
            warningDiv.style.padding = '20px';
            warningDiv.style.textAlign = 'center';
            
            warningDiv.innerHTML = `
                <h2 style="margin-bottom: 15px; color: #f39c12;">⚠️ Открыто с компьютера (Telegram Desktop)</h2>
                <p style="margin-bottom: 20px; max-width: 400px; color: #8892b0;">Для работы с MetaMask на ПК лучше использовать обычный браузер (Chrome), так как во встроенном окне Telegram расширения не поддерживаются.</p>
                <a href="${webVersionUrl}" target="_blank" style="background-color: #00d95f; color: #000; padding: 12px 24px; border-radius: 8px; text-decoration: none; font-weight: bold;">Открыть в браузере</a>
            `;
            document.body.appendChild(warningDiv);
        }

        // 2. Инициализация Telegram WebApp
        let tg = window.Telegram.WebApp;
        tg.expand();
                
        // 3. Функция подключения MetaMask
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    const provider = new ethers.providers.Web3Provider(window.ethereum);
                    await provider.send("wallet_requestPermissions", [{ eth_accounts: {} }]);
                    
                    const signer = provider.getSigner();
                    const address = await signer.getAddress();
                    
                    document.getElementById('wallet-status').innerText = `Подключено: ${address}`;
                    document.getElementById('connect-btn').innerText = `${address.substring(0,6)}...${address.substring(38)} ✅`;
                    document.getElementById('connect-btn').style.backgroundColor = 'transparent';
                    document.getElementById('connect-btn').style.color = '#fff';
                    document.getElementById('connect-btn').style.border = '1px solid #333';
                    
                    document.getElementById('anti-sybil-container').innerHTML = '';
                } catch (error) {
                    console.error("Ошибка:", error);
                    alert("Подключение отменено или кошелек заблокирован.");
                }
            } else {
                const userWantsToOpenApp = confirm("Кошелек не обнаружен. Открыть приложение MetaMask?");
                if (userWantsToOpenApp) {
                    const dappUrl = "robertkaasik.github.io/Airdrop-Automation-SaaS/";
                    window.location.href = `https://metamask.app.link/dapp/${dappUrl}`;
                }
            }
        }

        // 4. Функция запуска фарминга
        async function startFarm() {
            const statusText = document.getElementById('wallet-status').innerText;
            
            if (!statusText.includes("Подключено:")) {
                alert("Сначала подключите кошелек MetaMask!");
                return;
            }

            const walletAddress = statusText.replace("Подключено: ", "").trim();
            const container = document.getElementById('anti-sybil-container');
            const btn = document.getElementById('farm-btn');
            
            const originalBtnText = btn.innerText;
            btn.innerText = "Проверка Anti-Sybil...";
            btn.style.backgroundColor = "#f39c12";
            btn.style.border = "none";
            btn.style.color = "#000";

            try {
                const provider = new ethers.providers.JsonRpcProvider("https://ethereum-sepolia-rpc.publicnode.com");
                const balanceWei = await provider.getBalance(walletAddress);
                const balanceEth = ethers.utils.formatEther(balanceWei);

                if (parseFloat(balanceEth) < 0.005) {
                    container.innerHTML = `
                        <div class="card" style="border: 1px solid #e74c3c; background-color: rgba(231, 76, 60, 0.05);">
                            <h3 style="color: #e74c3c; margin-top: 0;">🛑 Ошибка: Пустой кошелек</h3>
                            <p style="font-size: 14px;">Anti-Sybil защита отклонила запуск. Ваш баланс <b>${parseFloat(balanceEth).toFixed(5)} SepETH</b>.</p>
                            <a href="https://sepolia-faucet.pk910.de/" target="_blank" class="faucet-link">⛏️ Получить тестовый ETH</a>
                        </div>
                    `;
                    btn.innerText = "Попробовать снова";
                    btn.style.backgroundColor = "#e74c3c";
                    return;
                }

                container.innerHTML = `
                    <div class="card" style="border: 1px solid #00d95f; background-color: rgba(0, 217, 95, 0.05);">
                        <h3 style="color: #00d95f; margin-top: 0;">✅ Anti-Sybil пройден!</h3>
                        <p>Баланс: ${parseFloat(balanceEth).toFixed(4)} SepETH.</p>
                        <p style="color: #8892b0; font-size: 14px;">Данные отправлены на сервер. Фарминг запущен!</p>
                    </div>
                `;
                
                btn.innerText = "Фарминг в процессе ⚙️";
                btn.style.backgroundColor = "transparent";
                btn.style.border = "1px solid #00d95f";
                btn.style.color = "#00d95f";

                try {
                    const response = await fetch('http://127.0.0.1:8000/api/start-farm', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            wallet: walletAddress,
                            balance: balanceEth,
                            telegram_id: tg.initDataUnsafe?.user?.id || "unknown"
                        })
                    });
                } catch (serverError) {
                    console.error("Ошибка отправки на сервер:", serverError);
                }
                
            } catch (error) {
                console.error("Ошибка проверки баланса:", error);
                alert("Ошибка сети. Попробуйте еще раз.");
                btn.innerText = originalBtnText;
                btn.style.backgroundColor = "#00d95f";
                btn.style.color = "#000";
                btn.style.border = "none";
            }
        }
    </script>
</body>
</html>
