<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Anti-Sybil Panel</title>
    <!-- Официальный скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #232e3c);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🚀 Smart Anti-Sybil</h1>
    <p>Панель управления фармингом</p>

    <div class="card">
        <p id="wallet-status">Кошелек не подключен</p>
        <button id="connect-btn" onclick="connectWallet()">Подключить MetaMask</button>
    </div>

    <div class="card">
        <button onclick="startFarm()" style="background-color: #2ecc71;">Запустить фарминг</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function connectWallet() {
    // 1. Проверяем, есть ли встроенный кошелек (как на ПК)
    if (window.ethereum) {
        try {
            const provider = new ethers.providers.Web3Provider(window.ethereum);
            await provider.send("wallet_requestPermissions", [{ eth_accounts: {} }]);
            const signer = provider.getSigner();
            const address = await signer.getAddress();
            
            document.getElementById('wallet-status').innerText = `Подключено: ${address.substring(0,6)}...${address.substring(38)}`;
            document.getElementById('connect-btn').innerText = "Подключено ✅";
        } catch (error) {
            console.error("Ошибка:", error);
            alert("Подключение отменено или кошелек заблокирован.");
        }
    } else {
        // 2. Если кошелька нет (например, открыли в Telegram с телефона)
        // Предлагаем открыть приложение MetaMask
        const userWantsToOpenApp = confirm("Кошелек не обнаружен. Открыть приложение MetaMask?");
        
        if (userWantsToOpenApp) {
            // Указываем ссылку на твой сайт (БЕЗ https://)
            const dappUrl = "robertkaasik.github.io/Airdrop-Automation-SaaS/";
            // Формируем специальную ссылку для вызова MetaMask на телефоне
            const metamaskLink = `https://metamask.app.link/dapp/${dappUrl}`;
            
            // Перенаправляем пользователя в приложение MetaMask
            window.location.href = metamaskLink;
        }
    }
}

 async function startFarm() {
    const statusText = document.getElementById('wallet-status').innerText;
    
    if (!statusText.includes("Подключено:")) {
        alert("Сначала подключите кошелек MetaMask!");
        return;
    }

    const walletAddress = statusText.replace("Подключено: ", "").trim();

    // Показываем пользователю, что пошел процесс
    alert("Запуск фарминга для кошелька: " + walletAddress);
    
    // Здесь мы можем вызывать твои блокчейн-функции или отправить данные
    console.log("Фарминг запущен для адреса:", walletAddress);
}
    </script>
</body>
</html>
