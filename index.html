<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Anti-Sybil Panel</title>
    <!-- Официальный скрипт Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Подключаем ethers.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #18222d);
            color: var(--tg-theme-text-color, #ffffff);
            padding: 20px;
            text-align: center;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #232e3c);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 15px;
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <h1>🚀 Smart Anti-Sybil</h1>
    <p>Панель управления фармингом</p>

    <div class="card">
        <p id="wallet-status">Кошелек не подключен</p>
        <button id="connect-btn" onclick="connectWallet()">Подключить MetaMask</button>
    </div>

    <div class="card">
        <button onclick="startFarm()" style="background-color: #2ecc71;">Запустить фарминг</button>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function connectWallet() {
            // Проверяем наличие ethereum в окне или мобильном браузере
            const providerEth = window.ethereum || (window.avalanche && window.avalanche);
            
            if (!providerEth) {
                alert("Провайдер кошелька не найден! Откройте сайт в браузере с поддержкой MetaMask (например, встроенном браузере приложения MetaMask).");
                return;
            }

            try {
                const provider = new ethers.providers.Web3Provider(providerEth);
                // Запрашиваем доступ к аккаунтам
                await provider.send("eth_requestAccounts", []);
                const signer = provider.getSigner();
                const address = await signer.getAddress();
                
                document.getElementById('wallet-status').innerText = `Подключено: ${address.substring(0,6)}...${address.substring(38)}`;
                document.getElementById('connect-btn').innerText = "Подключено ✅";
                tg.showAlert(`Кошелек успешно привязан: ${address}`);
            } catch (error) {
                console.error("Connection error:", error);
                alert("Не удалось подключить кошелек. Убедитесь, что разблокировали MetaMask.");
            }
        }

        async function startFarm() {
    const statusText = document.getElementById('wallet-status').innerText;
    
    // Проверяем, подключен ли кошелек перед запуском
    if (!statusText.includes("Подключено:")) {
        alert("Сначала подключите кошелек MetaMask!");
        return;
    }

    // Достаем адрес кошелька из текста статуса
    const walletAddress = statusText.replace("Подключено: ", "");

    try {
        // Отправляем запрос на твой локальный сервер (или бэкенд)
        const response = await fetch('http://127.0.0.1:8000/api/start-farm', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                wallet_address: walletAddress,
                action: "start_farming"
            })
        });

        const result = await response.json();
        alert(result.message || "Фарминг запущен!");
    } catch (error) {
        console.error("Ошибка отправки:", error);
        // Если сервер не запущен, просто отправляем данные в Telegram боту
        tg.sendData(JSON.stringify({ action: "start_farming", wallet: walletAddress }));
        tg.close();
    }
}
    </script>
</body>
</html>
